; PlatformIO project configuration for the M5Stack Tab5 (ESP32-P4).
; See docs/platformio-and-ci.md for why each pin/setting is what it is.

[platformio]
default_envs = tab5

[env:tab5]
; Downgraded from #55.03.39 (arduino-esp32 3.3.9, IDF 5.5.4) to #55.03.37
; (arduino-esp32 3.3.7, IDF 5.5.2) — this is the actual fix for the
; esp-aes/SDIO DMA-memory crash documented at length in docs/hardware.md.
; A controlled comparison on the upstream esp-hosted-mcu issue (#144)
; found arduino-esp32 3.3.11 leaves ~10x less usable DMA-capable memory
; than 3.3.7 for the same app (167KB vs 18KB largest contiguous block).
; Confirmed on this project's own hardware after the downgrade: largest
; DMA block stayed in the 190-240KB range through a full weather fetch
; (current/hourly/daily), vs. collapsing to single-digit KB and crashing
; on #55.03.39 — reproduced clean across 4 consecutive boots, zero
; esp-aes failures, zero SDIO asserts. No MIPI-DSI backlight flicker
; observed either (the regression #55.03.39 was originally chosen to
; avoid — see history below), confirmed by eye across the same 4 boots.
;
; Not yet re-verified on this version: WiFi.scanNetworks() in
; provisioning (the reason this project moved off IDF 5.5.1 in the first
; place — see history below). If scanning breaks again on 5.5.2, manual
; SSID entry is still the primary path in provisioning either way, so
; this isn't a hard blocker, just an open check.
;
; History: originally on #55.03.35 (IDF 5.5.1), WiFi.scanNetworks() was
; deterministically broken (-2/WIFI_SCAN_FAILED). Bumped to #55.03.39
; (IDF 5.5.4) to fix that, which introduced the esp-aes/DMA crash instead
; (root-caused much later — see docs/hardware.md). This downgrade to
; #55.03.37 is the current resolution; #55.03.39 remains the fallback if
; scanning turns out to need IDF 5.5.4 specifically, and #55.03.35 if
; neither version's trade-off is acceptable.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
; Dedicated Tab5 board (variant "m5stack_tab5"), not the generic
; "esp32-p4-evboard" this project started on. Matters beyond naming: the
; generic board's variant *also* defines BOARD_HAS_SDIO_ESP_HOSTED, but
; with entirely different pins baked in at static init time — wrong for
; this hardware. That's the real root cause behind the SDIO/WiFi bring-up
; problems this project fought through manual WiFi.setPins() calls; see
; docs/hardware.md. This board's extra_flags already bake in
; BOARD_HAS_PSRAM, ARDUINO_USB_CDC_ON_BOOT, and ARDUINO_USB_MODE too — no
; longer needed here.
board = m5stack-tab5-p4
; Same nonstandard "arduino.partitions" key issue as the generic board —
; PlatformIO only reads build.partitions, so this still needs setting
; explicitly or the build silently falls back to a ~1.25MB app partition.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; Excludes the font-size example's entry point and generated fonts from
; the real firmware build - [env:font-test] below flips this filter to
; build only those, sharing everything else (platform/board/lib_deps).
build_src_filter = +<*> -<font_size_test.cpp> -<fonts_test/>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Without this, ESP-IDF's [I]/[W]-level log lines (including the
    ; host/co-processor esp-hosted version banner) are compiled out
    ; entirely, not just hidden — cost us a misleading "that log line isn't
    ; present" conclusion earlier. See docs/hardware.md.
    -DCORE_DEBUG_LEVEL=3
    ; ESP32's default nano-newlib printf doesn't include float support
    ; (%f) unless explicitly linked in — otherwise it silently mis-renders
    ; float arguments (garbled output, not a crash). Forces the linker to
    ; pull in the float-capable printf/scanf implementations.
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float
lib_deps =
    https://github.com/M5Stack/M5GFX.git
    https://github.com/M5Stack/M5Unified.git
    lvgl/lvgl@^9.2
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7

; On-device example: cycles through several sizes of a custom Archivo
; bitmap font (tap to advance) to judge hero-digit legibility on real
; hardware - see src/font_size_test.cpp and docs/rendering.md's "Open
; problem" note. Not part of the tab5 firmware; run with
; `pio run -e font-test -t upload`. Regenerate the fonts it uses with
; tools/gen_test_fonts.sh if the size ladder changes.
[env:font-test]
extends = env:tab5
build_src_filter = -<*> +<display.cpp> +<font_size_test.cpp> +<fonts_test/>
; lv_font_conv's generated font .c files include "lvgl.h" only when this
; is defined (otherwise "lvgl/lvgl.h", which doesn't resolve under this
; project's lvgl library layout) - matches the plain <lvgl.h> include
; every other file in this project already uses.
;
; LV_FONT_FMT_TXT_LARGE: the 256/512px glyphs are wider than the compact
; glyph-descriptor format's fields fit (confirmed on build: "Too large
; font or glyphs ... Enable LV_FONT_FMT_TXT_LARGE"). Set only for this
; env, not in lv_conf.h, so the real firmware's LVGL build - and every
; built-in font it uses - keeps the smaller/default glyph-descriptor
; layout unchanged.
build_flags = ${env:tab5.build_flags} -DLV_LVGL_H_INCLUDE_SIMPLE -DLV_FONT_FMT_TXT_LARGE=1
; display.cpp is the only firmware file this example reuses (LVGL/M5GFX
; init + flush/touch callbacks, already confirmed working on this panel)
; - everything else in [env:tab5]'s lib_deps/build_flags carries over
; unchanged via `extends`.
