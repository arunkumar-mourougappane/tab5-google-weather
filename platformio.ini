; PlatformIO project configuration for the M5Stack Tab5 (ESP32-P4).
; See docs/platformio-and-ci.md for why each pin/setting is what it is.

[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
; The board.json ships this filename under a nonstandard "arduino.partitions"
; key that PlatformIO doesn't read automatically (only "build.partitions"
; is) — without this, it silently falls back to a ~1.25MB default scheme,
; not this board's actual 16MB flash. Verified: firmware with WiFi + TLS +
; JSON + QR linked in already overflows that fallback at ~1.6MB.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Without this, Arduino's Serial silently maps to a plain UART0 that
    ; isn't wired to the USB port at all — our own Serial.print/printf calls
    ; go nowhere and the monitor can't send input, while ESP-IDF's own boot
    ; log (a separate path, the USB-Serial-JTAG console) still shows up,
    ; which is what made this look like "no logs at all" rather than "wrong
    ; port." This routes Serial onto that same native USB controller.
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/M5Stack/M5GFX.git
    https://github.com/M5Stack/M5Unified.git
    lvgl/lvgl@^9.2
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7
