; PlatformIO project configuration for the M5Stack Tab5 (ESP32-P4).
; See docs/platformio-and-ci.md for why each pin/setting is what it is.

[platformio]
default_envs = tab5

[env:tab5]
; Downgraded from #55.03.39 (arduino-esp32 3.3.9, IDF 5.5.4) to #55.03.37
; (arduino-esp32 3.3.7, IDF 5.5.2) — this is the actual fix for the
; esp-aes/SDIO DMA-memory crash documented at length in docs/hardware.md.
; A controlled comparison on the upstream esp-hosted-mcu issue (#144)
; found arduino-esp32 3.3.11 leaves ~10x less usable DMA-capable memory
; than 3.3.7 for the same app (167KB vs 18KB largest contiguous block).
; Confirmed on this project's own hardware after the downgrade: largest
; DMA block stayed in the 190-240KB range through a full weather fetch
; (current/hourly/daily), vs. collapsing to single-digit KB and crashing
; on #55.03.39 — reproduced clean across 4 consecutive boots, zero
; esp-aes failures, zero SDIO asserts. No MIPI-DSI backlight flicker
; observed either (the regression #55.03.39 was originally chosen to
; avoid — see history below), confirmed by eye across the same 4 boots.
;
; Not yet re-verified on this version: WiFi.scanNetworks() in
; provisioning (the reason this project moved off IDF 5.5.1 in the first
; place — see history below). If scanning breaks again on 5.5.2, manual
; SSID entry is still the primary path in provisioning either way, so
; this isn't a hard blocker, just an open check.
;
; History: originally on #55.03.35 (IDF 5.5.1), WiFi.scanNetworks() was
; deterministically broken (-2/WIFI_SCAN_FAILED). Bumped to #55.03.39
; (IDF 5.5.4) to fix that, which introduced the esp-aes/DMA crash instead
; (root-caused much later — see docs/hardware.md). This downgrade to
; #55.03.37 is the current resolution; #55.03.39 remains the fallback if
; scanning turns out to need IDF 5.5.4 specifically, and #55.03.35 if
; neither version's trade-off is acceptable.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
; Dedicated Tab5 board (variant "m5stack_tab5"), not the generic
; "esp32-p4-evboard" this project started on. Matters beyond naming: the
; generic board's variant *also* defines BOARD_HAS_SDIO_ESP_HOSTED, but
; with entirely different pins baked in at static init time — wrong for
; this hardware. That's the real root cause behind the SDIO/WiFi bring-up
; problems this project fought through manual WiFi.setPins() calls; see
; docs/hardware.md. This board's extra_flags already bake in
; BOARD_HAS_PSRAM, ARDUINO_USB_CDC_ON_BOOT, and ARDUINO_USB_MODE too — no
; longer needed here.
board = m5stack-tab5-p4
; Same nonstandard "arduino.partitions" key issue as the generic board —
; PlatformIO only reads build.partitions, so this still needs setting
; explicitly or the build silently falls back to a ~1.25MB app partition.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
; Excludes the font/icon gallery demos' entry points and the font
; gallery's generated fonts from the real firmware build -
; [env:font-gallery]/[env:icon-gallery] below flip this filter to build
; only their own demo, sharing everything else (platform/board/
; lib_deps). dashboard_icons/ stays included here - unlike
; font_gallery_fonts/, those are production assets dashboard_ui.cpp
; actually links against, not gallery-only test fonts.
build_src_filter = +<*> -<font_gallery_demo.cpp> -<font_gallery_fonts/> -<icon_gallery_demo.cpp>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Compiled-in firmware version string - bump alongside
    ; RELEASE_NOTES.md's heading (source of truth for what changed) and
    ; any git tag cut for a release. Not read by any code yet; add a
    ; FIRMWARE_VERSION reference (e.g. in the statusbar or boot log) once
    ; there's an actual reason to show it on-device.
    -DFIRMWARE_VERSION=\"0.1.0\"
    ; Without this, ESP-IDF's [I]/[W]-level log lines (including the
    ; host/co-processor esp-hosted version banner) are compiled out
    ; entirely, not just hidden — cost us a misleading "that log line isn't
    ; present" conclusion earlier. See docs/hardware.md.
    -DCORE_DEBUG_LEVEL=3
    ; ESP32's default nano-newlib printf doesn't include float support
    ; (%f) unless explicitly linked in — otherwise it silently mis-renders
    ; float arguments (garbled output, not a crash). Forces the linker to
    ; pull in the float-capable printf/scanf implementations.
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float
    ; The dashboard's generated fonts (src/dashboard_fonts/, via
    ; tools/gen_dashboard_fonts.sh) need both of these - same reasons
    ; [env:font-gallery] originally needed them (see its own comments):
    ; lv_font_conv's output only `#include "lvgl.h"` (vs. the
    ; non-resolving "lvgl/lvgl.h") with the first flag, and the hero
    ; font's 312px glyphs exceed the compact glyph-descriptor format
    ; without the second ("Too large font or glyphs ... Enable
    ; LV_FONT_FMT_TXT_LARGE" at build time otherwise). Now needed by the
    ; real firmware, not just the font-gallery dev tool, so it lives here
    ; instead of only in that env.
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_FONT_FMT_TXT_LARGE=1
lib_deps =
    https://github.com/M5Stack/M5GFX.git
    https://github.com/M5Stack/M5Unified.git
    lvgl/lvgl@^9.2
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7

; On-device example: cycles through several sizes of a custom Archivo
; bitmap font (tap to advance) to judge hero-digit legibility on real
; hardware - see lib/font_gallery (the reusable viewer),
; src/font_gallery_demo.cpp (this app's thin entry point), and
; docs/rendering.md's "Open problem" note. Not part of the tab5 firmware;
; run with `pio run -e font-gallery -t upload`. Regenerate the fonts it
; uses with tools/gen_font_gallery.sh if tools/font_gallery_manifest.txt
; changes.
[env:font-gallery]
extends = env:tab5
build_src_filter = -<*> +<display.cpp> +<font_gallery_demo.cpp> +<font_gallery_fonts/>
; build_flags (including -DLV_LVGL_H_INCLUDE_SIMPLE and
; -DLV_FONT_FMT_TXT_LARGE=1, both originally added for this env's own
; generated fonts) now come from [env:tab5] via `extends`, since the
; dashboard's production fonts need them too. display.cpp is the only
; firmware file this example reuses (LVGL/M5GFX init + flush/touch
; callbacks, already confirmed working on this panel). lib/font_gallery
; is picked up automatically from lib/ (PlatformIO's Library Dependency
; Finder), not listed here.

; On-device example: shows every generated weather-condition icon
; (src/dashboard_icons/, via tools/gen_dashboard_icons.sh) side by side
; with captions, so each can be checked by eye against
; docs/mockups/dashboard.html / daily-forecast.html before trusting it in
; the real Dashboard - see lib/icon_gallery (the reusable viewer),
; src/icon_gallery_demo.cpp (this app's thin entry point). Not part of
; the tab5 firmware; run with `pio run -e icon-gallery -t upload`.
[env:icon-gallery]
extends = env:tab5
build_src_filter = -<*> +<display.cpp> +<icon_gallery_demo.cpp> +<dashboard_icons/>

; The tests themselves (test/test_geocode/, test/test_timezone/,
; test/test_weather/) exercise the *_parse.h headers
; (geocode_parse.h/weather_parse.h/timezone_parse.h): each filter +
; arena size, fed a real captured (or schema-accurate representative)
; API response body, checking no parse error, no arena overflow, and
; correct field extraction. Production code (geocode.cpp/weather.cpp/
; timezone_lookup.cpp) calls these same header-only functions, so a
; pass is a guarantee about what actually ships, not a parallel
; reimplementation that could drift.
;
; Deliberately doesn't touch geocodeLocation()/fetchCurrentConditions()/
; resolveTimezone() themselves, or anything using HTTPClient/
; WiFiClientSecure/Arduino String - those need real ESP32 network I/O
; and can only be trusted on real hardware anyway (this project has hit
; that lesson more than once - see docs/hardware.md). The *_parse.h
; layer is the one Arduino-free pinch point where a bug is both likely
; (three arena-sizing bugs so far) and fully testable off-device.
;
; Preferred: `pio test -e tab5-test` (see below) - builds, flashes, and
; runs these same tests on the real board over serial. This is the
; authoritative run: the arena-size constants above are only meaningful
; in terms of what the real 32-bit ESP32 target needs.
;
; `pio test -e native` also exists (runs on this machine, no board
; needed) purely as a fast pre-flight sanity check before reaching for
; hardware - but its numbers don't transfer directly: confirmed while
; building this suite that native's 64-bit host needs meaningfully more
; arena bytes than the real 32-bit target for the identical JSON body
; (ArduinoJson's internal bookkeeping is pointer/size_t-sized). A native
; pass is reassuring, not proof; a native fail with a given N doesn't
; prove the ESP32 build would fail with that same N either. Treat
; native as "did I break the filter/field-mapping logic," and
; `pio test -e tab5-test` as "is the arena size actually right."
[env:native]
platform = native
build_flags = -std=gnu++17 -Iinclude
lib_deps = bblanchon/ArduinoJson@^7

; `pio test -e tab5` (extending the real firmware env directly) hit a
; reproducible PlatformIO/library-manager bug on this project: Library
; Manager reports "Unity@2.6.1 has been installed!" but
; .pio/libdeps/tab5/Unity never actually lands on disk, so the build
; fails with "Implicit dependency ... unity.h not found" - confirmed on
; two separate machines (not a one-off/sandbox artifact), and confirmed
; NOT a disk-space/permissions issue. Suspected cause: ESP-IDF (which
; the Arduino framework sits on top of for Espressif boards) ships its
; own bundled "unity" test component, which can collide with the
; registry throwtheswitch/Unity library's resolution specifically on
; ESP32 targets - PlatformIO's implicit "auto-inject a test framework"
; behavior seems to be where this goes wrong.
;
; Worked around by not extending [env:tab5] at all: a separate, minimal
; env with the same board/platform (so tests genuinely build for and run
; on the real chip) but none of the firmware's GUI-stack lib_deps
; (M5GFX/M5Unified/lvgl/QRCode) or LVGL build_flags, none of which the
; parser tests need, and with Unity declared explicitly rather than
; relying on PlatformIO's implicit injection.
[env:tab5-test]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags = -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^7
    throwtheswitch/Unity@^2.6.1
; PlatformIO's Library Dependency Finder scans every directory under
; lib/ regardless of build_src_filter, so it still finds and tries to
; build lib/font_gallery here even though nothing in test/ references
; it - and font_gallery.h hard-errors without -DLV_LVGL_H_INCLUDE_SIMPLE
; (an [env:tab5]-only flag this minimal test env deliberately doesn't
; set). Exclude it explicitly rather than pulling in LVGL's build flags
; just to satisfy the scanner.
lib_ignore = font_gallery
; Excludes all of src/ - the *_parse.h headers under test/ (via -Iinclude
; above) are self-contained (ArduinoJson + json_arena_allocator.h only),
; so nothing here needs geocode.cpp/weather.cpp/timezone_lookup.cpp
; (Arduino/HTTPClient-dependent) or main.cpp/dashboard_ui.cpp/
; dashboard_fonts/*.c (LVGL-dependent, and none of it declared as a
; lib_dep in this env anyway). Without this, PlatformIO's default
; "compile everything under src/" behavior pulls all of that in and
; fails on missing LVGL headers.
build_src_filter = -<*>
