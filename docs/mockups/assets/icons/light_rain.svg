  <path d="M5 14C2.8 14 1 12.2 1 10.1C1 8.1 2.4 6.5 4.3 6.2C5 3.9 7.1 2.3 9.6 2.3C12.7 2.3 15.3 4.7 15.6 7.7C17.7 8 19.3 9.7 19.3 11.8C19.3 14.1 17.4 16 15 16H5" stroke="#f0e9d8" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#6fb3ac" stroke-width="1.6" stroke-linecap="round">
    <line x1="8" y1="19" x2="7.3" y2="21"/>
    <line x1="14" y1="19" x2="13.3" y2="21"/>
