<!--
  Weather condition icon: light rain (LIGHT_RAIN, LIGHT_RAIN_SHOWERS,
  LIGHT_TO_MODERATE_RAIN, CHANCE_OF_SHOWERS). Cloud shape and drop color
  reused from rain.svg exactly - only 2 short drops instead of rain.svg's
  3 full-length ones, to read as visibly lighter at a glance rather than
  needing a new color/shape language. No mockup distinguishes rain
  intensity, so this composition is original. See include/weather_icon.h.
-->
