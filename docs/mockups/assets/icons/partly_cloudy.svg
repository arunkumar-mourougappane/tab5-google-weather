<!--
  Weather condition icon: partly cloudy (PARTLY_CLOUDY, when not
  already claimed by the night-Moon rule). Distinct from mostly_clear.svg
  (sun ~60% covered, mostly visible) by inverting the emphasis - cloud
  dominant, sun mostly hidden (~80%) - and distinct from cloud.svg (no
  sun at all, used for MOSTLY_CLOUDY/CLOUDY). All 8 rays are present
  (not just the 2-3 that end up visible after the cloud occludes the
  rest) so the exposed portion still reads unambiguously as a full sun
  rather than an ambiguous ring with a couple of stray ticks - an
  earlier version with only the visible rays drawn didn't read as a sun
  at all, per hardware/visual review. Same composition technique as
  mostly_clear.svg (solid background-fill cloud occluding the sun) and
  the same cloud.svg path reused. No mockup defines this. See
  include/weather_icon.h.
-->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#d99a4e" stroke-width="1.7">
    <circle cx="7" cy="7" r="4"/>
    <g stroke-linecap="round">
      <line x1="7" y1="0.3" x2="7" y2="1.6"/>
      <line x1="7" y1="12.4" x2="7" y2="13.7"/>
      <line x1="0.3" y1="7" x2="1.6" y2="7"/>
      <line x1="12.4" y1="7" x2="13.7" y2="7"/>
      <line x1="2" y1="2" x2="3" y2="3"/>
      <line x1="12" y1="2" x2="11" y2="3"/>
      <line x1="2" y1="12" x2="3" y2="11"/>
      <line x1="12" y1="12" x2="11" y2="11"/>
    </g>
  </g>
  <g transform="translate(1.5,7.5) scale(0.98)">
    <path d="M6 18C3.5 18 1.5 16 1.5 13.6C1.5 11.4 3.1 9.6 5.2 9.3C5.9 6.5 8.5 4.5 11.5 4.5C15 4.5 17.9 7.2 18.2 10.7C20.4 11.1 22 13 22 15.2C22 17.7 19.9 19.7 17.3 19.7H6.5" fill="#121417" stroke="#f0e9d8" stroke-width="1.55" stroke-linejoin="round"/>
  </g>
</svg>
