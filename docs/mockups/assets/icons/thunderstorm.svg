<!--
  Weather condition icon: thunderstorm (THUNDERSTORM, THUNDERSHOWER,
  LIGHT_THUNDERSTORM_RAIN, SCATTERED_THUNDERSTORMS, HEAVY_THUNDERSTORM).
  Cloud shape scaled up slightly from rain.svg's to leave room for the
  bolt below; three rain drops (same teal color/angle/length as
  rain.svg's) - a cloud+bolt alone read as plain "lightning," not
  "thunderstorm," per hardware/visual review. The bolt is shifted up and
  shortened slightly from an earlier version to leave clean room for the
  center drop just below/behind its tip, matching the two flanking
  drops' angle, painted *before* the bolt so the bolt reads as in front
  (an earlier attempt crossed the drop through the bolt body with the
  drop on top, which read as a blended/muddy overlap rather than a
  clean drop in front of a drop). The bolt itself is an original design
  in the ember accent color (hash
  e2794e, dark-theme, docs/mockups/assets/style.css) - the same color
  this app's severity coloring already uses for "high" readings
  (dashboard_ui.cpp's severityColor()), reused here for its existing
  danger/energy association rather than introducing a new accent. No
  mockup defines a thunderstorm icon. See include/weather_icon.h.
-->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 13.5C2.8 13.5 1 11.7 1 9.6C1 7.6 2.4 6 4.3 5.7C5 3.4 7.1 1.8 9.6 1.8C12.7 1.8 15.3 4.2 15.6 7.2C17.7 7.5 19.3 9.2 19.3 11.3C19.3 13.6 17.4 15.5 15 15.5H5" stroke="#f0e9d8" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#6fb3ac" stroke-width="1.5" stroke-linecap="round">
    <line x1="4.5" y1="18" x2="3.7" y2="20.3"/>
    <line x1="18.5" y1="18" x2="17.7" y2="20.3"/>
  </g>
  <line x1="11.4" y1="20.4" x2="10.6" y2="22.7" stroke="#6fb3ac" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M13 12.6L9.6 18H12.1L10.3 21.4L15.4 15H12.7L14.3 12.6Z" fill="#e2794e"/>
</svg>
