  MODERATE_TO_HEAVY_RAIN, RAIN_PERIODICALLY_HEAVY - anything containing
  "HEAVY" once thunder/hail/snow have already been ruled out). Cloud
  shape reused from rain.svg's exact path; 4 longer/thicker drops
  instead of rain.svg's 3 shorter ones to read as visibly heavier at a
  glance. No mockup defines this. See include/weather_icon.h.
-->
